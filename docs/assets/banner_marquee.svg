<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      .bg { fill: #07090e; }
      .grid-line { stroke: #121826; stroke-width: 1; }
      .border-line { stroke: #1f293d; stroke-width: 1.5; }
      .text-tag { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 13px; letter-spacing: 0.22em; fill: #38bdf8; text-transform: uppercase; font-weight: 700; }
      .title-huge { font-family: 'Cinzel', serif; font-size: 82px; font-weight: 900; fill: url(#goldGrad); letter-spacing: 0.04em; text-transform: uppercase; filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.45)); }
      .desc-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 19px; fill: #94a3b8; letter-spacing: 0.02em; }
      .pill-bg { fill: #0d1322; stroke: #222f47; stroke-width: 1.2; rx: 8px; }
      .pill-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #cbd5e1; letter-spacing: 0.08em; }
      .gold-pill-bg { fill: rgba(245, 158, 11, 0.12); stroke: #f59e0b; stroke-width: 1.5; rx: 8px; }
      .gold-pill-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #fef08a; letter-spacing: 0.1em; text-transform: uppercase; }
      .cyan-pill-bg { fill: rgba(14, 165, 233, 0.12); stroke: #0284c7; stroke-width: 1.5; rx: 8px; }
      .cyan-pill-text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #7dd3fc; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>

    <!-- Radial Glows -->
    <radialGradient id="radialGlowGold" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlowBlue" cx="20%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlowCyan" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1400" height="560" class="bg" />

  <!-- Grid Pattern -->
  <g opacity="0.6">
    <line x1="0" y1="80" x2="1400" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1400" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1400" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1400" y2="320" class="grid-line" />
    <line x1="0" y1="400" x2="1400" y2="400" class="grid-line" />
    <line x1="0" y1="480" x2="1400" y2="480" class="grid-line" />

    <line x1="140" y1="0" x2="140" y2="560" class="grid-line" />
    <line x1="280" y1="0" x2="280" y2="560" class="grid-line" />
    <line x1="420" y1="0" x2="420" y2="560" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="560" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="560" class="grid-line" />
    <line x1="840" y1="0" x2="840" y2="560" class="grid-line" />
    <line x1="980" y1="0" x2="980" y2="560" class="grid-line" />
    <line x1="1120" y1="0" x2="1120" y2="560" class="grid-line" />
    <line x1="1260" y1="0" x2="1260" y2="560" class="grid-line" />
  </g>

  <!-- Ambient Glow Spheres -->
  <circle cx="700" cy="240" r="420" fill="url(#radialGlowGold)" />
  <circle cx="200" cy="400" r="340" fill="url(#radialGlowBlue)" />
  <circle cx="1200" cy="180" r="320" fill="url(#radialGlowCyan)" />

  <!-- Outer Structural Border -->
  <rect x="24" y="24" width="1352" height="512" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.8" />
  <rect x="36" y="36" width="1328" height="488" rx="12" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- Corner Ornamental Accents -->
  <path d="M 44 64 L 64 44 L 84 44" fill="none" stroke="#f59e0b" stroke-width="2" />
  <path d="M 1356 64 L 1336 44 L 1316 44" fill="none" stroke="#f59e0b" stroke-width="2" />
  <path d="M 44 496 L 64 516 L 84 516" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 1356 496 L 1336 516 L 1316 516" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Top Metadata Bar -->
  <g transform="translate(70, 75)">
    <!-- Cyan Pill -->
    <rect x="0" y="0" width="220" height="34" class="cyan-pill-bg" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="cyan-pill-text">PHASER 3 + REACT 18</text>

    <!-- Gold Pill -->
    <rect x="236" y="0" width="260" height="34" class="gold-pill-bg" />
    <circle cx="254" cy="17" r="4" fill="#fbbf24" />
    <text x="268" y="22" class="gold-pill-text">DEFENDERS OF THE RIFT</text>

    <!-- Right-aligned Version Pill -->
    <g transform="translate(1020, 0)">
      <rect x="0" y="0" width="240" height="34" class="pill-bg" />
      <text x="120" y="22" text-anchor="middle" class="pill-text">ACT I: GREEN LANDS • v1.0</text>
    </g>
  </g>

  <!-- Central Title Composition -->
  <g transform="translate(700, 230)" text-anchor="middle">
    <!-- Sub-tag Header -->
    <text y="-55" class="text-tag">TACTICAL FANTASY TOWER DEFENSE ENGINE</text>

    <!-- Huge Golden Title -->
    <text y="35" class="title-huge">THE LAST BASTION</text>

    <!-- Subtitle Description -->
    <text y="90" class="desc-text">Command legendary heroes, fortify multi-tier defense towers, and shatter demonic rift hordes in real time.</text>
  </g>

  <!-- Bottom Interactive Capability Cards -->
  <g transform="translate(70, 395)">
    <!-- Card 1: 5 Tower Classes -->
    <g transform="translate(0, 0)">
      <rect width="232" height="96" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="34" cy="34" r="14" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
      <text x="34" y="39" text-anchor="middle" font-size="14" fill="#fbbf24">🏹</text>
      <text x="58" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc">5 Tower Branches</text>
      <text x="58" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">L1 → L2 → L3 + Specs</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Archers, Mages, Artillery, Alchemy</text>
    </g>

    <!-- Card 2: Commander Hero -->
    <g transform="translate(256, 0)">
      <rect width="232" height="96" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="34" cy="34" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="34" y="39" text-anchor="middle" font-size="14" fill="#38bdf8">⚔️</text>
      <text x="58" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc">Sir Aldren &amp; Magic</text>
      <text x="58" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Direct Hero Control</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Meteor, Militia, Bastion Strike</text>
    </g>

    <!-- Card 3: Boss Battles -->
    <g transform="translate(512, 0)">
      <rect width="232" height="96" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="34" cy="34" r="14" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
      <text x="34" y="39" text-anchor="middle" font-size="14" fill="#ef4444">👹</text>
      <text x="58" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc">Epic Boss Battles</text>
      <text x="58" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Troll King Grukk</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f87171">Enrage phases, AoE stuns &amp; minion call</text>
    </g>

    <!-- Card 4: Interactive Codex -->
    <g transform="translate(768, 0)">
      <rect width="232" height="96" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="34" cy="34" r="14" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
      <text x="34" y="39" text-anchor="middle" font-size="14" fill="#c084fc">📜</text>
      <text x="58" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc">Codex &amp; Bestiary</text>
      <text x="58" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">In-Game Encyclopedia</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#c084fc">Enemies, Towers, NPCs, Lore</text>
    </g>

    <!-- Card 5: Star Tech Tree -->
    <g transform="translate(1024, 0)">
      <rect width="236" height="96" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="34" cy="34" r="14" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1" />
      <text x="34" y="39" text-anchor="middle" font-size="14" fill="#4ade80">⭐</text>
      <text x="58" y="32" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc">Bastion Tech Tree</text>
      <text x="58" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">18 Talents via Stars</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4ade80">6 branches with free respec</text>
    </g>
  </g>
</svg>
